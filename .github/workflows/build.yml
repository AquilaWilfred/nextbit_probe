name: Build binaries

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: [3.10, 3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate icons
        run: |
          python tools/make_icons.py assets/images/NextBit.png
        shell: bash

      - name: Build nextbit_probe
        run: |
          ICON="build/icons/NextBit.ico"
          if [ "${{ runner.os }}" = "macOS" ]; then ICON="build/icons/NextBit.icns"; fi
          pyinstaller --noconfirm --onefile --name nextbit_probe \
            --add-data "assets:assets" \
            --icon "$ICON" \
            nextbit_probe.py
        shell: bash

      - name: Build setup_usb
        run: |
          ICON="build/icons/NextBit.ico"
          if [ "${{ runner.os }}" = "macOS" ]; then ICON="build/icons/NextBit.icns"; fi
          pyinstaller --noconfirm --onefile --name setup_usb \
            --add-data "assets:assets" \
            --icon "$ICON" \
            setup_usb.py
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Create GitHub Release and upload binaries (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*
