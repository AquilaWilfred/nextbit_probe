name: Build binaries

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"] # Reduced to one version to speed up builds and avoid duplicate file names in release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pyinstaller pillow

      - name: Generate icons
        run: |
          python tools/make_icons.py assets/images/NextBit.png
        shell: bash

      - name: Build nextbit_probe
        run: |
          ICON="build/icons/NextBit.ico"
          if [ "${{ runner.os }}" = "macOS" ]; then ICON="build/icons/NextBit.icns"; fi
          pyinstaller --noconfirm --onefile --name "nextbit_probe_${{ runner.os }}" \
            --add-data "assets:assets" \
            --icon "$ICON" \
            nextbit_probe.py
        shell: bash

      - name: Build setup_usb
        run: |
          ICON="build/icons/NextBit.ico"
          if [ "${{ runner.os }}" = "macOS" ]; then ICON="build/icons/NextBit.icns"; fi
          pyinstaller --noconfirm --onefile --name "setup_usb_${{ runner.os }}" \
            --add-data "assets:assets" \
            --icon "$ICON" \
            setup_usb.py
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist

      - name: Create GitHub Release (Latest)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "NextBit Probe (Latest Alpha)"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          body: "Automated build from the latest commit. Download the file matching your OS below."
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
